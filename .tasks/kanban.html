<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-emotion-os v0.1：实现与场景验收 · 任务图</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='4' cy='8' r='3' fill='%231f9255'/%3E%3Ccircle cx='12' cy='8' r='3' fill='%23c4860c'/%3E%3C/svg%3E">
<style>
:root {
  --panel: #edf0ef;
  --surface: #ffffff;
  --surface-2: #f3f5f4;
  --band: rgba(29, 39, 43, 0.035);
  --ink: #1d272b;
  --muted: #536167;
  --soft: #87949a;
  --rule: #c5ccc4;
  --track: #7b8884;
  --track-soft: #a8b2ad;
  --lamp-green: #1f9255;
  --lamp-amber: #c4860c;
  --lamp-red: #c63f2b;
  --lamp-off: #b6beb9;
  --green-tint: #dbefe1;
  --amber-tint: #f6e9c8;
  --red-tint: #f6dcd5;
  --skip: #6b5d8c;
  --skip-tint: #e6e2ee;
  --shunt: #2c5fcc;
  --shunt-tint: #dce5f8;
  --focus: #2c5fcc;
  --font-ui: "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
  --font-sign: "Bahnschrift", "DIN Alternate", "DIN 2014", "Roboto Condensed", "Arial Narrow", "Microsoft YaHei UI", sans-serif;
  --font-mono: "Cascadia Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: #11171a; --surface: #192124; --surface-2: #1f282b; --band: rgba(226, 232, 229, 0.03);
    --ink: #e1e7e4; --muted: #9ba9a7; --soft: #6e7c7b; --rule: #2d383b; --track: #7d8b88; --track-soft: #4a5658;
    --lamp-green: #3cc87c; --lamp-amber: #eeb03a; --lamp-red: #f06a52; --lamp-off: #3d484a;
    --green-tint: #173326; --amber-tint: #3a2f16; --red-tint: #3d1f1a; --skip: #a595cf; --skip-tint: #2a2638;
    --shunt: #6f9cff; --shunt-tint: #1c2945; --focus: #8fb2ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --panel: #11171a; --surface: #192124; --surface-2: #1f282b; --band: rgba(226, 232, 229, 0.03);
  --ink: #e1e7e4; --muted: #9ba9a7; --soft: #6e7c7b; --rule: #2d383b; --track: #7d8b88; --track-soft: #4a5658;
  --lamp-green: #3cc87c; --lamp-amber: #eeb03a; --lamp-red: #f06a52; --lamp-off: #3d484a;
  --green-tint: #173326; --amber-tint: #3a2f16; --red-tint: #3d1f1a; --skip: #a595cf; --skip-tint: #2a2638;
  --shunt: #6f9cff; --shunt-tint: #1c2945; --focus: #8fb2ff; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--panel); color: var(--ink); font: 14px/1.55 var(--font-ui); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sign { font-family: var(--font-sign); font-stretch: condensed; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.mono { font-family: var(--font-mono); font-size: 12px; }
.muted { color: var(--muted); }

/* ---------- top bar ---------- */
.topbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 24px; padding: 16px 24px 10px; }
.eyebrow { font-family: var(--font-sign); font-stretch: condensed; text-transform: uppercase; letter-spacing: 0.16em; font-size: 12px; color: var(--muted); }
.topbar h1 { margin: 2px 0 0; font-size: 21px; line-height: 1.3; font-weight: 700; overflow-wrap: anywhere; }
.goal { grid-column: 1 / -1; color: var(--muted); margin: 0; max-width: 980px; }
.goal b { color: var(--ink); font-weight: 600; }
.top-actions { display: flex; align-items: center; gap: 10px; justify-self: end; }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--lamp-off); display: inline-block; }
.live.on i { background: var(--lamp-green); animation: blink 2.4s ease-in-out infinite; }
.live.lost i { background: var(--lamp-red); }
@keyframes blink { 50% { opacity: 0.35; } }
.btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--track); }
.btn:disabled { color: var(--soft); cursor: default; }

/* ---------- summary strip ---------- */
.strip { margin: 4px 24px 0; padding: 10px 16px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; display: grid; grid-template-columns: minmax(120px, 1fr) auto; gap: 8px 24px; align-items: center; }
.rail { display: flex; gap: 3px; height: 10px; align-items: stretch; min-width: 0; }
.rail span { flex: 1 1 0; min-width: 3px; border-radius: 2px; background: var(--lamp-off); cursor: pointer; border: 0; padding: 0; }
.rail span.gap { flex: 0 0 6px; background: transparent; cursor: default; }
.rail .s-done { background: var(--lamp-green); }
.rail .s-in_progress { background: var(--lamp-amber); }
.rail .s-blocked { background: var(--lamp-red); }
.rail .s-skipped { background: repeating-linear-gradient(135deg, var(--skip) 0 2px, transparent 2px 5px); }
.rail .s-ready { background: var(--track-soft); }
.rail .sel { outline: 2px solid var(--shunt); outline-offset: 1px; }
.figures { display: flex; gap: 18px; flex-wrap: wrap; justify-content: flex-end; }
.fig { display: flex; flex-direction: column; align-items: flex-end; }
.fig.action { border: 0; background: none; padding: 3px 5px; margin: -3px -5px; border-radius: 4px; cursor: pointer; }
.fig.action:hover { background: var(--surface-2); }
.fig.action small { text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.fig b { font-family: var(--font-sign); font-stretch: condensed; font-size: 22px; line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; }
.fig small { color: var(--muted); font-size: 12px; }
.fig.alert b { color: var(--lamp-red); }
.verdict { grid-column: 1 / -1; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.verdict details { min-width: 0; }
.verdict summary { cursor: pointer; }
.verdict details p { margin: 6px 0 0; overflow-wrap: anywhere; }
.verdict .tag { font-weight: 700; color: var(--ink); }
.verdict.ok .tag { color: var(--lamp-green); }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 2px; margin: 14px 24px 0; border-bottom: 1px solid var(--rule); overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px 7px; cursor: pointer; color: var(--muted); font-size: 14px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.tab .count { font-family: var(--font-sign); font-stretch: condensed; margin-left: 6px; color: var(--soft); }

/* ---------- layout ---------- */
.stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; padding: 0 24px 24px; }
.stage.with-drawer { grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; }
.view { min-width: 0; padding-top: 14px; }
.view[hidden] { display: none; }

/* ---------- graph canvas ---------- */
.canvas-tools { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; margin-bottom: 8px; flex-wrap: wrap; }
.graph-find { display: flex; flex: 1 1 360px; align-items: center; gap: 8px; min-width: 0; }
.search-box { display: flex; align-items: center; gap: 8px; flex: 1 1 220px; max-width: 340px; min-width: 120px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 5px 10px; }
.search-box span { color: var(--muted); font-size: 12px; white-space: nowrap; }
.search-box input { width: 100%; min-width: 0; border: 0; background: none; color: var(--ink); font: inherit; font-size: 13px; outline-offset: 3px; }
.graph-find select { max-width: 150px; min-height: 33px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; padding: 4px 8px; }
.graph-context { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 16px; margin: 0 0 8px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
.graph-context p { margin: 0; }
.graph-context #graph-context { overflow-wrap: anywhere; }
.graph-help { margin-left: auto; position: relative; }
.graph-help summary { cursor: pointer; white-space: nowrap; }
.graph-help .help-body { position: absolute; top: 24px; right: 0; z-index: 5; width: 270px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); box-shadow: 0 5px 20px #0002; }
.graph-help .help-body p + p { margin-top: 5px; }
.zoom { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--surface); }
.zoom button { border: 0; background: none; padding: 5px 9px; min-height: 32px; cursor: pointer; font-size: 13px; }
.zoom button:hover { background: var(--surface-2); }
.zoom button:disabled { cursor: default; color: var(--soft); }
.zoom button + button { border-left: 1px solid var(--rule); }
.zoom output { padding: 4px 8px; min-width: 52px; text-align: center; border-left: 1px solid var(--rule); font-family: var(--font-sign); font-stretch: condensed; font-size: 13px; }
.canvas-wrap { position: relative; }
.canvas-scroll { overflow: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); height: max(340px, calc(100vh - 380px)); min-height: 340px; overscroll-behavior: contain; scrollbar-color: var(--track-soft) var(--surface-2); cursor: grab; }
.canvas-scroll.dragging { cursor: grabbing; user-select: none; }
.canvas-scroll.dragging .node { cursor: grabbing; }
.canvas-sizer { position: relative; }
.canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.canvas svg { position: absolute; inset: 0; overflow: visible; }
.lane-label { position: absolute; left: 0; padding: 12px 12px 0 16px; border-right: 1px solid var(--rule); }
.lane-label b { display: block; font-size: 14px; line-height: 1.35; }
.lane-label small { color: var(--muted); font-size: 12px; display: block; }
.lane-label .lane-meter { margin-top: 8px; height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.lane-label .lane-meter i { display: block; height: 100%; background: var(--lamp-green); }
.lane-label .gate { margin-top: 6px; font-size: 12px; color: var(--muted); }
.lane-label .gate.ok { color: var(--lamp-green); }
.wave-head { position: absolute; top: 14px; text-align: center; color: var(--muted); font-size: 12px; }
.wave-head b { font-family: var(--font-sign); font-stretch: condensed; font-size: 15px; color: var(--ink); font-weight: 600; margin-right: 6px; }
.subgroup { position: absolute; border: 1px dashed var(--track-soft); border-radius: 8px; pointer-events: none; }
.subgroup span { position: absolute; top: -9px; left: 10px; padding: 0 6px; background: var(--surface); font-size: 12px; color: var(--muted); line-height: 16px; }

.node { position: absolute; display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 8px 16px 8px 18px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; cursor: pointer; transition: opacity .15s, border-color .15s; }
.node:hover { border-color: var(--track); }
.node.critical { border-color: var(--ink); border-width: 1px 1px 1px 1px; box-shadow: inset 0 3px 0 var(--ink); }
.node.dim { opacity: 0.27; }
.node.match { box-shadow: inset 3px 0 0 var(--shunt); }
.node.related { border-color: var(--track); }
.node.sel { border-color: var(--shunt); outline: 2px solid var(--shunt); outline-offset: 2px; }
.node.s-done { background: var(--green-tint); }
.node.s-in_progress { background: var(--amber-tint); border-color: var(--lamp-amber); }
.node.s-blocked { background: var(--red-tint); border-color: var(--lamp-red); }
.node.s-skipped { background: var(--skip-tint); color: var(--muted); }
.node.s-skipped .n-label { text-decoration: line-through; text-decoration-color: var(--soft); }
.n-top { display: flex; align-items: baseline; gap: 8px; font-size: 12px; color: var(--muted); }
.n-seq { font-family: var(--font-sign); font-stretch: condensed; font-size: 15px; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.n-status { margin-left: auto; white-space: nowrap; }
.n-label { font-size: 13px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.n-foot { margin-top: auto; display: flex; gap: 8px; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.n-foot .loop { color: var(--shunt); font-weight: 600; }
.n-foot .issue { color: var(--lamp-red); font-weight: 600; }
.lamp { position: absolute; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; border: 2px solid var(--surface); background: var(--lamp-off); }
.lamp.in { left: -7px; }
.lamp.out { right: -7px; }
.lamp.green { background: var(--lamp-green); }
.lamp.red { background: var(--lamp-red); }
.lamp.amber { background: var(--lamp-amber); }
.lamp.hollow { background: var(--surface); border: 2px solid var(--lamp-off); }
.lamp.hollow-amber { background: var(--surface); border: 2px solid var(--lamp-amber); }

.edge { fill: none; stroke: var(--track); stroke-width: 1.4; }
.edge.soft { stroke-dasharray: 2 5; stroke: var(--track-soft); }
.edge.crit { stroke: var(--ink); stroke-width: 2.4; }
.edge.dim { opacity: 0.18; }
.edge.hot { stroke: var(--ink); stroke-width: 2.4; opacity: 1; }
.edge.loop { stroke: var(--shunt); stroke-width: 1.6; stroke-dasharray: 6 4; }
.edge.loop.used { stroke-width: 2.2; }
.lane-band { fill: var(--band); }
.col-band { fill: var(--band); }
.lane-rule { stroke: var(--rule); stroke-width: 1; }
.chip-bg { fill: var(--surface); stroke: var(--shunt); stroke-width: 1; }
.chip-text { fill: var(--shunt); font: 600 11px var(--font-ui); }
.minimap { position: absolute; right: 16px; bottom: 16px; z-index: 2; width: 184px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; box-shadow: 0 2px 8px #0001; }
.minimap summary { padding: 5px 8px; color: var(--muted); cursor: pointer; font-size: 11px; }
.minimap svg { display: block; width: 100%; height: 105px; border-top: 1px solid var(--rule); cursor: crosshair; touch-action: none; }
.minimap .map-node { fill: var(--lamp-off); stroke: var(--surface); stroke-width: 2; }
.minimap .map-node.done { fill: var(--lamp-green); }
.minimap .map-node.in_progress { fill: var(--lamp-amber); }
.minimap .map-node.blocked { fill: var(--lamp-red); }
.minimap .map-node.ready { fill: var(--track); }
.minimap .map-node.sel { stroke: var(--shunt); stroke-width: 7; }
.minimap .map-node.dim { opacity: .25; }
.minimap .map-viewport { fill: var(--shunt-tint); fill-opacity: .25; stroke: var(--shunt); stroke-width: 2; vector-effect: non-scaling-stroke; pointer-events: none; }
.canvas.low-detail .n-foot, .canvas.low-detail .n-top > span:nth-child(2) { display: none; }
.canvas.readable-overview .n-label { font-size: calc(12px / var(--graph-zoom)); line-height: 1.22; }
.canvas.readable-overview .n-status { font-size: calc(10px / var(--graph-zoom)); }
.canvas.readable-overview .n-seq { font-size: calc(11px / var(--graph-zoom)); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 10px; font-size: 12px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i.l { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.legend svg { width: 34px; height: 10px; }

/* ---------- drawer ---------- */
.drawer { min-width: 0; margin-top: 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; align-self: start; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
.drawer[hidden] { display: none; }
.d-head { position: sticky; top: 0; background: var(--surface); padding: 14px 16px 10px; border-bottom: 1px solid var(--rule); z-index: 1; }
.d-head .row { display: flex; align-items: center; gap: 8px; }
.d-head h2 { margin: 6px 0 2px; font-size: 17px; line-height: 1.4; overflow-wrap: anywhere; }
.d-head .crumb { font-size: 12px; color: var(--muted); }
.d-close { margin-left: auto; }
.d-body { padding: 4px 16px 18px; }
.d-sec { padding: 12px 0 4px; border-bottom: 1px dashed var(--rule); }
.d-sec:last-child { border-bottom: 0; }
.d-sec h3 { margin: 0 0 8px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.d-sec h3 .sign { font-size: 15px; }
.d-sec h3 small { margin-left: auto; font-weight: 400; color: var(--muted); }
.crit-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.crit-list li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 8px; font-size: 13px; }
.crit-list .mk { width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; background: var(--lamp-off); }
.crit-list .mk.ok { background: var(--lamp-green); }
.crit-list .mk.no { background: var(--surface); border: 2px solid var(--lamp-red); }
.crit-list .mk.wait { background: var(--surface); border: 2px solid var(--lamp-off); }
.crit-list .ev { grid-column: 2; font-size: 12px; color: var(--muted); word-break: break-word; }
.crit-list .ev code { font-family: var(--font-mono); font-size: 11.5px; }
.linkish { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-decoration-color: var(--track-soft); text-underline-offset: 3px; cursor: pointer; text-align: left; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 1px 8px; border-radius: 4px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--lamp-off); }
.pill.done i { background: var(--lamp-green); } .pill.in_progress i { background: var(--lamp-amber); } .pill.blocked i { background: var(--lamp-red); }
.pill.ready i { background: var(--surface); border: 2px solid var(--lamp-green); } .pill.waiting i { background: var(--surface); border: 2px solid var(--lamp-red); }
.pill.skipped i { background: var(--skip); }
.callout { padding: 8px 10px; border-left: 3px solid var(--lamp-red); background: var(--red-tint); font-size: 13px; border-radius: 0 6px 6px 0; margin: 8px 0; }
.callout.info { border-left-color: var(--shunt); background: var(--shunt-tint); }
.cmd { display: block; margin-top: 6px; padding: 6px 8px; background: var(--surface-2); border-radius: 4px; font-family: var(--font-mono); font-size: 11.5px; word-break: break-all; color: var(--muted); }

/* execution profile */
.exec-sum { margin: 0 0 8px; font-weight: 600; font-size: 13px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.hint-list { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.hint-list li::before { content: "· "; }
.n-foot .xb { color: var(--ink); }
.x-tag { font-size: 11.5px; color: var(--muted); margin-left: 6px; font-weight: 400; }

/* execution tree */
.tree { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.tree ul { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 1px solid var(--rule); margin-left: 5px; }
.tree li { position: relative; }
.tree ul > li::before { content: ""; position: absolute; left: -14px; top: 13px; width: 10px; border-top: 1px solid var(--rule); }
.tree details > summary { list-style: none; cursor: pointer; }
.tree details > summary::-webkit-details-marker { display: none; }
.t-row { display: flex; align-items: flex-start; gap: 7px; padding: 3px 0; }
.t-row .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; background: var(--lamp-off); }
.t-row .dot.done { background: var(--lamp-green); } .t-row .dot.in_progress, .t-row .dot.approved { background: var(--lamp-amber); }
.t-row .dot.blocked { background: var(--lamp-red); } .t-row .dot.skipped { background: var(--skip); }
.t-row .t-label { min-width: 0; }
.t-row .t-meta { margin-left: auto; font-size: 11px; color: var(--muted); flex-shrink: 0; }
.t-label { overflow-wrap: anywhere; }
.t-row.focus .t-label { font-weight: 700; }
.t-row .leaf { font-size: 11px; color: var(--muted); border: 1px solid var(--rule); border-radius: 3px; padding: 0 4px; }
.tree summary .caret { width: 12px; flex: none; color: var(--soft); font-size: 9px; margin: 6px 2px 0 -2px; transition: transform .15s; }
.tree details[open] > summary .caret { transform: rotate(90deg); }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; }
.meter .m-done { background: var(--lamp-green); } .meter .m-skip { background: var(--skip); opacity: .6; }
.meter .m-prog { background: var(--lamp-amber); } .meter .m-block { background: var(--lamp-red); }

/* ---------- order view ---------- */

.card h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 13px; }
.chain .arrow { color: var(--soft); }
.waves { display: flex; gap: 0; overflow-x: auto; padding-bottom: 6px; }
.wave { flex: 0 0 236px; padding: 0 14px 0 0; position: relative; }
.wave + .wave { padding-left: 14px; border-left: 1px dashed var(--rule); }
.wave h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 400; }
.wave h4 b { font-family: var(--font-sign); font-stretch: condensed; font-size: 18px; color: var(--ink); margin-right: 6px; font-weight: 600; }
.w-item { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 10px; margin-bottom: 6px; cursor: pointer; }
.w-item:hover { border-color: var(--track); }
.w-item.critical { box-shadow: inset 3px 0 0 var(--ink); }
.w-item .row { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: var(--muted); }
.w-item .row .sign { font-size: 14px; color: var(--ink); font-weight: 600; }
.w-item .lbl { font-size: 13px; font-weight: 600; margin-top: 2px; }
.seq-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }

.seq-table tr:last-child td { border-bottom: 0; }
.seq-table tbody tr { cursor: pointer; }
.seq-table tbody tr:hover td { background: var(--surface-2); }
.seq-table .sign { font-size: 15px; font-weight: 600; }
.table-wrap { overflow-x: auto; }

/* ---------- monitor view ---------- */
.kpis { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr 1fr 1.1fr; gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; }
.kpi b { display: block; font-family: var(--font-sign); font-stretch: condensed; font-size: 30px; line-height: 1.05; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi b small { font-size: 16px; color: var(--muted); font-weight: 400; }
.kpi span { font-size: 12px; color: var(--muted); }
.kpi.alert b { color: var(--lamp-red); }
.mon-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; }
.g-row { display: grid; grid-template-columns: minmax(7em, 0.8fr) minmax(0, 2fr) 9.5em; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px dashed var(--rule); font-size: 13px; }
.g-row:last-child { border-bottom: 0; }
.g-row .indent { color: var(--soft); }
.g-row .num { font-family: var(--font-sign); font-stretch: condensed; font-size: 14px; white-space: nowrap; text-align: right; }
.attn { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; }
.attn li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; }

.empty { padding: 28px; text-align: center; color: var(--muted); }

      execSec.appendChild(el("div", { class: "callout" }, ["可能与 ", el("button", { class: "linkish", type: "button", text: other.seq + " " + other.label, onclick: function () { select(other.id); } }),
        " 同时运行且写入重叠（" + c.paths.join("；") + "）：不要同时派发，先做一个或拆开写入范围。"]));
    });
    if (!xv.declared) hints.insertBefore(el("li", { text: n.kind === "gate" ? "关卡：由人裁决，不派模型" : "未声明执行方式：默认由主会话执行，继承当前模型与 effort（单代理基线）" }), hints.firstChild);
    if (hints.childNodes.length) execSec.appendChild(hints);
    if (n.kind !== "gate" && !(n.exec && n.exec.mode === "human")) {
      execSec.appendChild(el("p", { class: "muted", style: "font-size:12px;margin:10px 0 6px", text: "这是计划派发的档位，不是验收证据；实际运行的模型与 effort 以宿主记录为准（Claude Code 的 /tasks、Codex 子线程记录）。有执行树时，叶子默认继承这里的档位。" }));
    }
    body.appendChild(execSec);

    // tree
    var mode = n.participation === "stepwise" ? "逐层参与：每层由人选择后再下钻" : "连续执行：已授权范围内按依赖推进";
    var treeSec = el("section", { class: "d-sec" }, [el("h3", {}, ["执行树", n.tree && n.tree.found ? el("small", { text: "叶子 " + n.tree.leaves_done + "/" + n.tree.leaves_total + " 完成 · 根" + (TREE_STATUS[n.tree.root_status] || n.tree.root_status) }) : null]),
      el("p", { class: "muted", style: "margin:0 0 8px;font-size:12.5px", text: "拆解方式：" + mode })]);
    if (n.tree_stale) treeSec.appendChild(el("div", { class: "callout" }, ["节点在 " + fmtTime(n.tree_stale_since) + " 被返工或重开，这棵树之前的验收已失效。先重开受影响的树节点并重新验收，节点才能关闭：",
      el("code", { class: "cmd", text: "python _shared/decomp-state.py reopen --task " + n.tree_ref + " --node <树节点> --reason \"…\" --evidence \"…\" --apply" })]));
    if (n.tree && n.tree.found && n.tree.schema_known === false) treeSec.appendChild(el("div", { class: "callout", text: "这棵树的状态格式版本（" + (n.tree.schema_version || "未知") + "）与看板支持的不一致，下面的进度可能不准。" }));
    if (n.tree) treeSec.appendChild(renderTree(n.tree));
    else treeSec.appendChild(el("div", { class: "muted", style: "font-size:13px" }, ["这个节点还没有拆执行树。需要逐层拆到可执行的叶子时运行：",
      el("code", { class: "cmd", text: "python task_graph.py new-tree --graph " + DATA.meta.graph_id + " --node " + n.id })]));
    body.appendChild(treeSec);

    // attempts
    if ((n.attempts || []).length) {
      var al = el("ul", { class: "attn" });
      n.attempts.slice().reverse().forEach(function (a) {
        var label = { pass: "通过", fail: "未通过", reset: "解除阻断", reopen: "重开" }[a.result] || a.result;
        al.appendChild(el("li", {}, [pill(a.result === "pass" ? "done" : a.result === "fail" ? "blocked" : "ready", label),
          el("span", { text: fmtTime(a.ts) + " · 第 " + ((a.iteration || 0) + 1) + " 轮" + (a.criteria && a.criteria.length ? " · " + a.criteria.join(", ") : "") + (a.exec ? " · 当时：" + execText(a.exec) : "") }),
          a.reason || a.note || a.evidence ? el("span", { class: "why", text: a.reason || a.note || a.evidence }) : null]));
      });
      body.appendChild(el("section", { class: "d-sec" }, [el("h3", {}, ["尝试记录", el("small", { text: n.attempts.length + " 条" })]), al]));
    }
    if (n.downstream.length) {
      var dl = el("div", { class: "chips" });
      n.downstream.forEach(function (d) { var dn = nodes[d]; dl.appendChild(el("button", { class: "btn", type: "button", text: dn.seq + " " + dn.label, onclick: function () { select(d); } })); });
      body.appendChild(el("section", { class: "d-sec" }, [el("h3", {}, ["下游节点", el("small", { text: "完成后它们才可能启动" })]), dl]));
    }
    drawer.appendChild(body);
    drawer.scrollTop = keepScroll;
  }

  /* ---------------- order view ---------------- */
  function renderOrder() {
    var view = document.getElementById("view-order");
    view.textContent = "";
    var nodes = nodeMap();
    if (!DATA.nodes.length) { view.appendChild(el("div", { class: "empty", text: "还没有节点，暂无执行顺序。" })); return; }
    var readyChips = el("div", { class: "chips" });
    DATA.order.ready.forEach(function (id) {
      // Same rule as the CLI `ready`: only conflicts with work that could run right now.
      var rn = nodes[id], warn = ((rn.exec_view || {}).conflicts || []).some(function (c) {
        var o = nodes[c.id]; return o && (o.display_status === "ready" || o.display_status === "in_progress");
      }) ? " · 写入冲突" : "";
      // A stable focus key: the chip text changes when a conflict appears or clears.
      readyChips.appendChild(el("button", { class: "btn", type: "button", "data-focus-key": "ready-node:" + id, onclick: function () { select(id); } }, [rn.seq + " " + rn.label,
        el("span", { class: "x-tag", text: (rn.exec ? execBadge(rn.exec) : rn.kind === "gate" ? "人" : "主会话") + warn })]));
    });
    if (!DATA.order.ready.length) readyChips.appendChild(el("span", { class: "muted", text: DATA.kpi.in_progress ? "没有新的可启动节点，先完成进行中的节点。" : "没有可启动节点。" }));
    var chain = el("div", { class: "chain" });
    var rp = DATA.order.remaining_critical_path;
    rp.forEach(function (id, i) {
      if (i) chain.appendChild(el("span", { class: "arrow", text: "→" }));
      chain.appendChild(el("button", { class: "linkish", type: "button", text: nodes[id].seq + " " + nodes[id].label, onclick: function () { select(id); } }));
    });
    if (!rp.length) chain.appendChild(el("span", { class: "muted", text: "所有节点都已关闭。" }));
    view.appendChild(el("div", { class: "order-top" }, [
      el("div", { class: "card" }, [el("h3", { text: "现在可启动（入条件已满足）" }), readyChips]),
      el("div", { class: "card" }, [el("h3", { text: "剩余关键路径 · 预估合计 " + DATA.order.remaining_critical_length }), chain])
    ]));
    var waves = el("div", { class: "waves", role: "list" });
    DATA.order.waves.forEach(function (ids, wi) {
      var col = el("div", { class: "wave", role: "listitem" }, [el("h4", {}, [el("b", { text: "第 " + (wi + 1) + " 批" }), ids.length > 1 ? ids.length + " 项可并行" : "1 项"])]);
      ids.forEach(function (id) {
        var n = nodes[id];
        col.appendChild(el("button", { class: "w-item" + (n.critical ? " critical" : ""), type: "button", "data-focus-key": "order-node:" + id, onclick: function () { select(id); } }, [
          el("span", { class: "row" }, [el("span", { class: "sign", text: n.seq }), el("span", { text: n.group_path.join(" › ") }), el("span", { style: "margin-left:auto" }, [pill(n.display_status)])]),
          el("span", { class: "lbl", text: n.label, style: "display:block" })
        ]));
      });
      waves.appendChild(col);
    });
    view.appendChild(waves);
    var tbody = el("tbody");
    orderedIds().forEach(function (id) {
      var n = nodes[id];
      var deps = n.upstream.map(function (u) { return nodes[u.id].seq + (u.type === "soft" ? "（软）" : ""); }).join("、") || "—";
      tbody.appendChild(el("tr", { onclick: function () { select(id); }, tabindex: "0", "data-focus-key": "order-row:" + id, onkeydown: function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(id); } } }, [
        el("td", {}, [el("span", { class: "sign", text: n.seq })]), el("td", {}, [n.label, n.critical ? el("span", { class: "muted", text: " · 关键" }) : null]),
        el("td", { text: n.group_path.join(" › ") || "—" }), el("td", { text: deps }), el("td", { text: (n.exec_view || {}).summary || "—" }), el("td", { text: String(n.estimate) }), el("td", {}, [pill(n.display_status)])
      ]));
    });
    view.appendChild(el("div", { class: "table-wrap" }, [el("table", { class: "seq-table" }, [
      el("thead", {}, [el("tr", {}, ["序号", "节点", "上级节点", "依赖", "执行", "预估", "状态"].map(function (h) { return el("th", { text: h }); }))]), tbody
    ])]));
    view.appendChild(el("p", { class: "muted", style: "font-size:12px", text: "批次按依赖深度划分，只用于阅读顺序；实际调度以入条件为准，节点满足入条件就可以启动，不必等同批其他节点。" }));
  }

  /* ---------------- monitor view ---------------- */
  function meterFor(c, total) {
    function seg(cls, v) { return v ? el("i", { class: cls, style: "width:" + (v / total * 100) + "%" }) : null; }
    return el("div", { class: "meter" }, [seg("m-done", c.done), seg("m-prog", c.in_progress), seg("m-block", c.blocked), seg("m-skip", c.skipped)]);
  }
  function renderMonitor() {
    var view = document.getElementById("view-monitor");
    view.textContent = "";
    var k = DATA.kpi, nodes = nodeMap();
    function kpi(value, sub, label, alert) { return el("div", { class: "kpi" + (alert ? " alert" : "") }, [el("b", {}, [String(value), sub ? el("small", { text: sub }) : null]), el("span", { text: label })]); }
    view.appendChild(el("div", { class: "kpis" }, [
      kpi(k.done, " / " + k.effective_total, "节点以证据完成（跳过的不计入）"),
      kpi(Math.round(k.estimate_ratio * 100), "%", "按预估加权的进度"),
      kpi(k.in_progress, null, "进行中"),
      kpi(k.blocked, null, "阻断", k.blocked > 0),
      kpi(k.loop_rounds, null, "累计返工轮次"),
      kpi(k.tree_leaves_total ? k.tree_leaves_done : "—", k.tree_leaves_total ? " / " + k.tree_leaves_total : null, "执行树叶子完成")
    ]));
    var left = el("div", {}, []), right = el("div", {}, []);
    // groups
    var gcard = el("div", { class: "card" }, [el("h3", { text: "按上级节点的进展" })]);
    if (!DATA.groups.length) gcard.appendChild(el("p", { class: "muted", style: "margin:0;font-size:13px", text: "没有定义上级节点。" }));
    DATA.groups.forEach(function (g) {
      var total = g.members.length || 1;
      var gate = g.exit && g.exit.length ? "里程碑 " + g.exit.filter(function (x) { return x.met; }).length + "/" + g.exit.length : "";
      gcard.appendChild(el("div", { class: "g-row" }, [
        el("span", {}, [el("span", { class: "indent", text: g.depth ? "└ ".padStart(g.depth * 2 + 2, " ") : "" }), g.label, el("span", { class: "muted", text: g.kind && g.kind !== "group" ? " · " + g.kind : "" })]),
        meterFor(g.counts, total),
        el("span", { class: "num", text: g.counts.done + "/" + (g.members.length - g.counts.skipped) + (gate ? " · " + gate : "") })
      ]));
    });
    left.appendChild(gcard);
    // goal acceptance
    var goalCard = el("div", { class: "card", style: "margin-top:14px" }, [el("h3", { text: "总目标验收" })]);
    var gl = el("ul", { class: "crit-list" });
    ((DATA.meta.goal || {}).exit || []).forEach(function (x) { gl.appendChild(critItem(!!x.met, x.text, x.evidence)); });
    if (!gl.childNodes.length) goalCard.appendChild(el("p", { class: "muted", style: "margin:0;font-size:13px", text: "总目标没有单独的验收条件，只能按节点关闭情况判断。" }));
    else goalCard.appendChild(gl);
    if (!DATA.readiness.complete) goalCard.appendChild(el("p", { class: "muted", style: "font-size:12.5px;margin:10px 0 0", text: "未完成原因：" + DATA.readiness.reasons.join("；") }));
    if (DATA.meta.task_ref) goalCard.appendChild(el("p", { class: "muted", style: "font-size:12px;margin:8px 0 0" }, ["关联任务文件：", el("code", { class: "mono", text: DATA.meta.task_ref })]));
    left.appendChild(goalCard);
    // attention
    var attn = el("ul", { class: "attn" });
    DATA.nodes.forEach(function (n) {
      if (n.display_status === "blocked") attn.appendChild(el("li", {}, [pill("blocked"), el("button", { class: "linkish", type: "button", text: n.seq + " " + n.label, onclick: function () { select(n.id); } }), el("span", { class: "why", text: n.acceptance_issue || n.blocked_reason || "" })]));
    });
    (k.in_progress_age || []).slice().sort(function (a, b) { return b.hours - a.hours; }).forEach(function (a) {
      var n = nodes[a.id];
      attn.appendChild(el("li", {}, [pill("in_progress"), el("button", { class: "linkish", type: "button", text: n.seq + " " + n.label, onclick: function () { select(n.id); } }),
        el("span", { class: "why", text: "已进行 " + (a.hours >= 24 ? (a.hours / 24).toFixed(1) + " 天" : a.hours + " 小时") + "，出条件 " + exitCount(n).join("/") + " 已验证" })]));
    });
    DATA.loop_edges.filter(function (le) { return le.count > 0; }).forEach(function (le) {
      attn.appendChild(el("li", {}, [el("span", { class: "pill", style: "color:var(--shunt)", text: "返工 " + le.count + "/" + le.max }),
        el("span", { text: nodes[le.from].label + " → " + nodes[le.to].label }), el("span", { class: "why", text: le.count >= le.max ? "已到上限，再失败会阻断" : "还可返工 " + (le.max - le.count) + " 轮" })]));
    });
    var acard = el("div", { class: "card" }, [el("h3", { text: "需要关注" })]);
    acard.appendChild(attn.childNodes.length ? attn : el("p", { class: "muted", style: "margin:0;font-size:13px", text: "没有阻断、长时间进行中或返工中的节点。" }));
    right.appendChild(acard);
    // timeline
    var tl = el("ul", { class: "timeline" });
    DATA.events.slice(0, 80).forEach(function (e) {
      var tgt = nodes[e.target] ? nodes[e.target].seq + " " + nodes[e.target].label : e.target;
      tl.appendChild(el("li", {}, [el("span", { class: "t", text: fmtTime(e.ts) }), el("span", { class: "k " + e.type, text: EVENTS[e.type] || e.type }), el("span", { class: "d", text: tgt + (e.detail ? " · " + e.detail : "") })]));
    });
    right.appendChild(el("div", { class: "card", style: "margin-top:14px" }, [el("h3", { text: "事件时间线（最新在上）" }), tl]));
    view.appendChild(el("div", { class: "mon-grid" }, [left, right]));
  }

  /* ---------------- shell ---------------- */
  function setView(v) {
    ui.view = v;
    ["graph", "order", "monitor"].forEach(function (name) {
      document.getElementById("view-" + name).hidden = name !== v;
      document.getElementById("tab-" + name).setAttribute("aria-selected", name === v ? "true" : "false");
      document.getElementById("tab-" + name).tabIndex = name === v ? 0 : -1;
    });
    writeHash();
    if (v === "graph") { if (ui.zoomMode === "fit") ui.zoom = null; applyZoom(); updateGraphHighlights(); }
  }
  document.querySelectorAll(".tab").forEach(function (t, index) {
    t.addEventListener("click", function () { setView(t.getAttribute("data-view")); });
    t.addEventListener("keydown", function (ev) {
      var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab")), next;
      if (ev.key === "ArrowRight") next = (index + 1) % tabs.length;
      else if (ev.key === "ArrowLeft") next = (index + tabs.length - 1) % tabs.length;
      else if (ev.key === "Home") next = 0;
      else if (ev.key === "End") next = tabs.length - 1;
      else return;
      ev.preventDefault(); setView(tabs[next].getAttribute("data-view")); tabs[next].focus();
    });
  });
  function select(id) {
    var previous = ui.node, saved = captureViewState();
    if (id && !previous && saved.focus && saved.focus.scope !== "drawer") ui.returnFocus = saved.focus;
    ui.node = id;
    writeHash();
    renderSummary(); renderGraph(); renderDrawer();
    if (ui.zoomMode === "fit") { ui.zoom = null; applyZoom(); }
    restoreViewState(saved, previous !== id);
    updateGraphHighlights();
    if (id) {
      var card = nodeElement(id);
      if (card && ui.view === "graph") card.scrollIntoView({ block: "nearest", inline: "nearest" });
    } else if (previous && saved.focus && saved.focus.scope === "drawer") {
      if (!restoreFocus(ui.returnFocus)) { var back = ui.view === "graph" && nodeElement(previous); if (back) back.focus({ preventScroll: true }); }
    }
  }
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && ui.node) { ev.preventDefault(); select(null); }
    if (ev.key === "/" && !ev.ctrlKey && !ev.metaKey && !ev.target.closest("input, textarea, select, [contenteditable]")) {
      ev.preventDefault(); setView("graph"); document.getElementById("node-search").focus();
    }
  });

  function applyTheme() {
    var root = document.documentElement;
    if (ui.theme === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ui.theme);
    document.getElementById("theme-btn").textContent = "主题：" + { auto: "跟随系统", light: "浅色", dark: "深色" }[ui.theme];
  }
  document.getElementById("theme-btn").addEventListener("click", function () {
    ui.theme = { auto: "light", light: "dark", dark: "auto" }[ui.theme];
    store("tg-theme", ui.theme); applyTheme();
  });

  function renderAll() {
    var saved = captureViewState();
    if (ui.node && !nodeMap()[ui.node]) ui.node = null;
    renderHeader(); renderSummary(); renderGraph(); renderOrder(); renderMonitor(); renderDrawer();
    setView(ui.view);
    restoreViewState(saved);
  }

  function poll() {
    fetch(CONFIG.endpoint + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (next) {
      // content revision covers linked execution trees and same-second writes
      var changed = next.meta.revision !== DATA.meta.revision;
      ui.lastOk = true;
      if (changed) {
        DATA = next; renderAll();
      } else { DATA.meta.generated_at = next.meta.generated_at; renderHeader(); }
    }).catch(function () { ui.lastOk = false; renderHeader(); }).then(function () { setTimeout(poll, CONFIG.poll_ms); });
  }

  readHash();
  var saved = store("tg-theme");
  if (saved === "light" || saved === "dark" || saved === "auto") ui.theme = saved;
  applyTheme();
  legend();
  renderAll();
  if (ui.node) {
    if (ui.view === "graph") locateNode(ui.node);
  }
  function resizeGraph() {
    if (ui.view !== "graph") return;
    if (ui.zoomMode === "fit") { ui.zoom = null; applyZoom(); updateGraphHighlights(); }
    else updateMinimapViewport();
  }
  window.addEventListener("resize", resizeGraph);
  if (window.ResizeObserver) new ResizeObserver(resizeGraph).observe(graphScroll);
  window.addEventListener("hashchange", function () {
    var before = [ui.view, ui.node];
    ui.node = null; ui.query = ""; ui.status = "all"; readHash();
    if (before[0] !== ui.view) setView(ui.view);
    if (before[1] !== ui.node) select(ui.node);
    updateGraphHighlights();
  });
  if (CONFIG.live) setTimeout(poll, CONFIG.poll_ms);
})();
</script>
</body>
</html>
