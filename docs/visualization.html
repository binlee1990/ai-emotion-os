<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>情绪引擎管理台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    --paper: #FAFAF6; --ink: #1B2030; --indigo: #3E5AA8; --vermilion: #D8552B;
    --grey: #878C99; --card: #EDF1F8; --hairline: #D9DDE6; --side: #F2F3F0;
    --serif: "Songti SC", "Noto Serif CJK SC", "SimSun", "STSong", serif;
    --sans: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    --mono: "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html { scrollbar-gutter: stable; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans);
    font-size: 14.5px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- 管理台壳 ---------- */
  .app { display: grid; grid-template-columns: 216px 1fr; min-height: 100vh; }
  aside { background: var(--side); border-right: 1px solid var(--hairline);
    padding: 20px 0 30px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { padding: 0 18px 14px; border-bottom: 1px solid var(--hairline); margin-bottom: 10px; }
  .brand b { font-family: var(--serif); font-size: 17px; display: block; }
  .brand span { font-size: 11px; color: var(--grey); font-family: var(--mono); }
  .navgroup { font-size: 10.5px; color: var(--grey); letter-spacing: 0.18em;
    padding: 14px 18px 5px; font-family: var(--mono); }
  aside a { display: block; padding: 7px 18px; color: #38405A; text-decoration: none;
    font-size: 13.5px; border-left: 3px solid transparent; }
  aside a:hover { background: #EBECE8; }
  aside a.on { border-left-color: var(--vermilion); background: #fff; color: var(--ink);
    font-weight: 600; }
  aside a:focus-visible { outline: 2px solid var(--vermilion); outline-offset: -2px; }
  main { padding: 28px 34px 60px; min-width: 0;
    padding-left: max(34px, env(safe-area-inset-left, 0px)); }

  .pagehead { margin-bottom: 18px; }
  .pagehead h1 { font-family: var(--serif); font-size: 26px; font-weight: 700; }
  .pagehead p { font-size: 13.5px; color: #454B5C; max-width: 46em; margin-top: 3px; }
  .panel { border: 1px solid var(--hairline); border-radius: 12px; background: #fff;
    padding: 20px 22px; margin-bottom: 14px; }
  .panel h3 { font-family: var(--serif); font-size: 17px; margin-bottom: 4px; }
  .panel .sub { font-size: 12.5px; color: var(--grey); margin-bottom: 12px; }
  .src { font-size: 11.5px; color: var(--grey); margin-top: 10px; line-height: 1.6; }

  /* 首页数字卡 */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px; margin-bottom: 14px; }
  .stat { border: 1px solid var(--hairline); border-radius: 10px; background: #fff; padding: 12px 16px; }
  .stat b { font-family: var(--mono); font-size: 24px; color: var(--vermilion); display: block; }
  .stat span { font-size: 12px; color: var(--grey); }

  /* 散点 */
  .howto { border: 1px solid var(--hairline); border-left: 3px solid var(--vermilion);
    border-radius: 8px; background: #fff; padding: 11px 15px; font-size: 13px;
    color: #454B5C; margin-bottom: 12px; max-width: 52em; }
  .howto b { color: var(--ink); }
  .fambar { display: flex; flex-wrap: wrap; gap: 7px; margin: 4px 0 8px; }
  .fam { display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    border: 1px solid var(--hairline); border-radius: 99px; padding: 3px 11px 3px 7px;
    font-size: 12px; background: #fff; user-select: none; }
  .fam i { width: 9px; height: 9px; border-radius: 50%; font-style: normal; }
  .fam .n { font-family: var(--mono); font-size: 10.5px; color: var(--grey); }
  .fam.on { border-color: var(--ink); background: var(--card); }
  .axes { display: flex; gap: 7px; margin-left: auto; }
  .axes button { font: 12px/1 var(--sans); padding: 6px 12px; border-radius: 99px;
    border: 1px solid var(--hairline); background: #fff; color: var(--ink); cursor: pointer; }
  .axes button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .axes button:focus-visible, .fam:focus-visible, .btn:focus-visible, .seg button:focus-visible {
    outline: 2px solid var(--vermilion); outline-offset: 2px; }
  .space-frame { border: 1px solid var(--hairline); border-radius: 12px; background: #fff;
    padding: 16px 10px 6px; overflow-x: auto; }
  #space { width: 100%; height: auto; display: block; min-width: 700px; }
  #space circle { cursor: pointer; }
  #space circle:hover { stroke: var(--ink); stroke-width: 1.5; }
  .detail { min-height: 46px; border: 1px dashed var(--hairline); border-radius: 8px;
    margin-top: 10px; padding: 8px 14px; font-size: 13px; color: #454B5C;
    display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  .detail b { font-family: var(--serif); font-size: 16px; color: var(--ink); }

  /* 表格 */
  .tablewrap { overflow-x: auto; border: 1px solid var(--hairline); border-radius: 10px;
    background: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 620px; }
  th { text-align: left; font-size: 11px; color: var(--grey); font-weight: 500;
    font-family: var(--mono); letter-spacing: 0.06em; padding: 9px 13px;
    border-bottom: 1px solid var(--hairline); background: var(--paper); white-space: nowrap; }
  td { padding: 7px 13px; border-bottom: 1px solid #EDF0F5; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #F7F8FA; }
  td.f { font-family: var(--mono); font-size: 12px; color: var(--indigo); white-space: nowrap; }
  td.v { font-family: var(--mono); white-space: nowrap; }
  td.src { font-size: 11.5px; color: var(--grey); }
  td .grp { font-size: 10.5px; color: var(--vermilion); font-family: var(--mono); display: block; }
  .num { font-variant-numeric: tabular-nums; }

  /* 搜索框 */
  .search { width: 100%; max-width: 380px; padding: 8px 14px; font: 14px var(--sans);
    border: 1px solid var(--hairline); border-radius: 99px; background: #fff;
    margin-bottom: 12px; }
  .search:focus { outline: 2px solid var(--vermilion); outline-offset: 1px; }

  /* 卡片网格 */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .evt { border: 1px solid var(--hairline); border-radius: 10px; background: #fff; padding: 12px 14px 10px; }
  .evt .code { font-family: var(--mono); font-size: 11px; color: var(--grey); letter-spacing: 0.08em; }
  .evt .code b { color: var(--ink); font-size: 13.5px; margin-left: 6px; }
  .evt p { font-size: 12.5px; color: #454B5C; margin-top: 5px; line-height: 1.55; }
  .evt .eg { font-size: 12px; color: var(--grey); margin-top: 5px;
    border-top: 1px dashed var(--hairline); padding-top: 5px; }
  .evt .eg::before { content: "例 "; font-family: var(--mono); font-size: 10px; color: var(--vermilion); }

  /* 事件档案列表 */
  .evtrow { border: 1px solid var(--hairline); border-radius: 10px; background: #fff;
    margin-bottom: 8px; overflow: hidden; }
  .er-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    padding: 11px 16px; cursor: pointer; }
  .er-head:hover { background: #F7F8FA; }
  .er-head:focus-visible { outline: 2px solid var(--vermilion); outline-offset: -2px; }
  .er-head .code { font-family: var(--mono); font-size: 11px; color: var(--grey); letter-spacing: 0.08em; }
  .er-head b { font-size: 15px; font-family: var(--serif); }
  .badge { font-size: 11px; border-radius: 99px; padding: 1px 9px; border: 1px solid; white-space: nowrap; }
  .badge.neg { color: #A33B2A; border-color: #E5C4BC; background: #FBF1EE; }
  .badge.pos { color: #1E7A4C; border-color: #BFDCCB; background: #EFF8F2; }
  .badge.dual { color: #4E6A8C; border-color: #C4D2E2; background: #EFF4FA; }
  .badge.ghost { color: var(--grey); border-color: var(--hairline); background: var(--paper); }
  .er-fire { font-size: 12.5px; color: #454B5C; }
  .er-acts { font-size: 11.5px; color: var(--grey); margin-left: auto; white-space: nowrap; }
  .er-arrow { color: var(--grey); transition: transform 0.15s; }
  .evtrow.open .er-arrow { transform: rotate(180deg); }
  .er-body { border-top: 1px solid var(--hairline); padding: 16px 18px 14px; background: #FDFDFB; }
  .er-body .def { font-size: 13.5px; color: #38405A; }
  .er-body .eg { font-size: 12.5px; color: var(--grey); margin-bottom: 12px; }
  .dossier h4 { font-family: var(--serif); font-size: 15px; margin: 16px 0 8px; }
  .dossier h4:first-child { margin-top: 0; }
  .dossier h4 span { font-family: var(--mono); font-size: 10.5px; color: var(--grey);
    margin-left: 8px; letter-spacing: 0.05em; font-weight: 400; }
  .dstages { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 8px; }
  .dstage { border: 1px solid var(--hairline); border-radius: 8px; background: #fff;
    padding: 10px 13px; min-width: 0; }
  .dstage b { font-size: 11px; color: var(--vermilion); font-family: var(--mono); display: block;
    margin-bottom: 6px; letter-spacing: 0.06em; }
  .dstage pre { font-family: var(--mono); font-size: 11.5px; line-height: 1.7; color: #38405A;
    white-space: pre-wrap; margin: 0; word-break: break-all; }
  .dstage .say { font-family: var(--serif); font-size: 17px; font-weight: 700; line-height: 1.5; }
  .dimbar { display: grid; grid-template-columns: 58px 1fr 38px; gap: 7px; align-items: center;
    font-size: 12px; margin-bottom: 4px; }
  .dimbar .track { background: var(--card); border-radius: 99px; height: 8px; overflow: hidden; }
  .dimbar .fill { height: 100%; border-radius: 99px; background: var(--indigo); }
  .dimbar.neg .fill { background: #A33B2A; }
  .dimbar .num { font-family: var(--mono); font-size: 10.5px; text-align: right; color: #454B5C; }
  .apnote { font-size: 11.5px; color: var(--grey); margin-top: 6px; line-height: 1.6; }
  .vartab { width: 100%; border-collapse: collapse; background: #fff; font-size: 12.5px;
    border: 1px solid var(--hairline); border-radius: 8px; }
  .vartab td { padding: 7px 13px; border-bottom: 1px solid #EDF0F5; vertical-align: baseline; }
  .vartab tr:last-child td { border-bottom: none; }
  .vchip { display: inline-block; border: 1px solid var(--hairline); border-radius: 99px;
    padding: 1px 10px; margin: 1px 4px 1px 0; font-size: 12px; background: #fff; white-space: nowrap; }
  .vchip i { font-style: normal; font-family: var(--mono); font-size: 10.5px; color: var(--grey); }
  a.vchip { color: var(--indigo); text-decoration: none; border-color: #C4D2E2; }
  a.vchip:hover { background: var(--card); }
  .relrow { font-size: 12.5px; color: #454B5C; margin-bottom: 7px; display: flex;
    gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .relrow .k { font-family: var(--mono); font-size: 10.5px; color: var(--vermilion);
    min-width: 60px; letter-spacing: 0.06em; }
  .relrow .mono { font-family: var(--mono); font-size: 11.5px; color: #38405A; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--ink); }

  /* 模拟器 */
  .seg { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 14px; }
  .seg button { font: 12.5px var(--sans); padding: 6px 14px; border-radius: 8px;
    border: 1px solid var(--hairline); background: #fff; cursor: pointer; color: var(--ink); }
  .seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .slider-row { display: grid; grid-template-columns: 120px 1fr 52px; gap: 12px;
    align-items: center; margin-bottom: 10px; font-size: 13.5px; }
  .slider-row output { font-family: var(--mono); text-align: right; color: var(--indigo); }
  input[type="range"] { width: 100%; accent-color: var(--vermilion); }
  .simout { background: var(--card); border-radius: 10px; padding: 16px 20px; }
  .simout .say { font-family: var(--serif); font-size: 22px; font-weight: 700; margin: 2px 0 10px; }
  .bars { display: grid; gap: 6px; }
  .bar-row { display: grid; grid-template-columns: 90px 1fr 44px; gap: 10px; align-items: center;
    font-size: 13px; }
  .bar-row .track { background: #fff; border-radius: 99px; height: 12px; overflow: hidden; }
  .bar-row .fill { height: 100%; border-radius: 99px; }
  .bar-row .num { font-family: var(--mono); font-size: 12px; text-align: right; }

  /* 回放/峰终/对比 */
  .steps-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .steps-nav button { font: 12.5px var(--sans); padding: 6px 13px; border-radius: 8px;
    border: 1px solid var(--hairline); background: #fff; cursor: pointer; }
  .steps-nav button.on { background: var(--vermilion); color: #fff; border-color: var(--vermilion); }
  .endcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .endcard { border: 1px solid var(--hairline); border-radius: 10px; background: #fff;
    padding: 14px 16px; cursor: pointer; }
  .endcard.on { border-color: var(--vermilion); border-width: 1.5px; background: #FDF6F2; }
  .endcard b { font-family: var(--serif); font-size: 16px; }
  .radar-frame { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  #radar { width: 340px; height: auto; flex: none; }
  .picklist { display: flex; flex-wrap: wrap; gap: 6px; max-width: 520px; }
  .pick { border: 1px solid var(--hairline); border-radius: 99px; padding: 3px 12px;
    font-size: 12.5px; background: #fff; cursor: pointer; user-select: none; }
  .pick.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* 弧线（回放页复用） */
  #arc { width: 100%; height: auto; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px;
    font-size: 12.5px; color: #454B5C; align-items: center; }
  .legend .key { display: inline-flex; align-items: center; gap: 6px; }
  .legend .swatch { width: 16px; height: 3px; border-radius: 2px; }
  .legend .dot { width: 9px; height: 9px; border-radius: 50%; }

  /* 机制卡 */
  .mechgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .mechcard { border: 1px solid var(--hairline); border-radius: 12px; background: #fff; padding: 18px 20px 14px; }
  .mechcard h3 { font-family: var(--serif); font-size: 18px; margin-bottom: 4px; }
  .mechcard .one { font-size: 13px; color: #454B5C; margin-bottom: 10px; }
  .mechcard ul { padding-left: 18px; font-size: 13px; color: #38405A; }
  .mechcard li { margin-bottom: 5px; }
  .mechcard .src { border-top: 1px dashed var(--hairline); padding-top: 8px; margin-top: 10px; }

  /* 流程条 */
  .flow { display: flex; flex-wrap: wrap; gap: 0; align-items: stretch; margin-bottom: 16px; }
  .flow .fstep { border: 1px solid var(--hairline); border-radius: 10px; background: #fff;
    padding: 10px 14px; margin: 0 14px 8px 0; position: relative; max-width: 240px; }
  .flow .fstep b { font-size: 13px; display: block; }
  .flow .fstep span { font-size: 11.5px; color: var(--grey); font-family: var(--mono); }
  .flow .fstep::after { content: "→"; position: absolute; right: -13px; top: 40%; color: var(--grey); }
  .flow .fstep:last-child::after { content: none; }
  .logbox { background: #1E2430; color: #C9D4E8; border-radius: 10px; padding: 14px 18px;
    font-family: var(--mono); font-size: 12px; line-height: 1.8; white-space: pre-wrap; }

  /* 语域 */
  .registers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .reg { border: 1px solid var(--hairline); border-radius: 10px; padding: 16px 16px 12px; background: #fff; }
  .reg .tag { font-family: var(--mono); font-size: 11px; color: var(--grey); letter-spacing: 0.12em; }
  .reg .scene { font-size: 12px; color: #454B5C; margin: 2px 0 10px; }
  .reg .say { font-family: var(--serif); font-size: 20px; line-height: 1.45; min-height: 3em; }
  .reg .chips { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .reg .chips span { font-size: 12px; background: var(--card); border-radius: 99px;
    padding: 2px 10px; color: #38405A; }

  /* 倒U */
  #uu { width: 100%; height: auto; display: block; min-width: 380px; }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    aside { position: static; height: auto; padding: 10px 0; }
    aside nav { display: flex; flex-wrap: wrap; padding: 0 10px; }
    .navgroup { display: none; }
    aside a { border-left: none; border-bottom: 2px solid transparent; padding: 6px 10px; }
    aside a.on { border-bottom-color: var(--vermilion); }
    main { padding: 18px 16px 40px; }
    .endcards { grid-template-columns: 1fr; }
    .registers { grid-template-columns: 1fr; }
    .reg .say { min-height: 0; }
  }
</style>
</head>

<div class="app">
<aside>
  <div class="brand"><b>ai-emotion-os</b><span>情绪引擎 · v0.7.0</span></div>
  <nav id="nav">
    <div class="navgroup">概览</div>
    <a href="#home" data-p="home">首页 · 情绪空间</a>
    <div class="navgroup">数据</div>

</aside>
<main id="main"></main>

      <div class="stat"><b class="num">11</b><span>情绪家族</span></div>

    </div>
    <div class="fambar" id="fambar"></div>
    <div class="space-frame"><svg id="space" role="img" aria-label="88 个情绪类别分布散点"></svg></div>
    <div class="detail" id="detail">点击图中的一个点，这里会显示该情绪的详细信息。</div>`);
  drawSpace();
}

function drawSpace() {
  const cats = DATA.categories;
  const svg = document.getElementById('space');
  const detail = document.getElementById('detail');
  const W = 1000, H = 520, mL = 52, mR = 18, mT = 16, mB = 44;
  let axis = 'v';
  const on = new Set(Object.keys(FAM));
  const x = v => mL + (W - mL - mR) * (v + 1) / 2;
  const y = a => mT + (H - mT - mB) * (1 - a);

  function draw() {
    let s = '';
    for (const g of [-1, -0.5, 0, 0.5, 1]) {
      s += `<line x1="${x(g)}" y1="${mT}" x2="${x(g)}" y2="${H - mB}" stroke="#EDF0F5"/>`;
      s += `<text x="${x(g)}" y="${H - mB + 15}" text-anchor="middle" font-size="10"
            fill="#878C99" font-family="Consolas,monospace">${g > 0 ? '+' + g : g}</text>`;
    }
    s += `<line x1="${x(0)}" y1="${mT}" x2="${x(0)}" y2="${H - mB}" stroke="#D9DDE6"/>`;
    s += `<text x="${(W + mL) / 2}" y="${H - 7}" text-anchor="middle" font-size="11.5" fill="#878C99">${
      axis === 'v' ? '难受 −1 ← 效价 valence → +1 舒服' : '被支配 −1 ← 支配 dominance → +1 占上风'}</text>`;
    s += `<text x="${mL - 32}" y="${(H - mB + mT) / 2}" text-anchor="middle" font-size="11.5"
          fill="#878C99" transform="rotate(-90 ${mL - 32} ${(H - mB + mT) / 2})">激动 ↑ 唤醒</text>`;
    const focus = on.size < Object.keys(FAM).length;
    const DX = [-10, 0, 10], DY = [-13, 15, -25, 27];
    cats.forEach((c, i) => {
      const f = FAM[c.family]; if (!f) return;
      const dim = !on.has(c.family);
      const cx = x(c[axis]), cy = y(c.a);
      const dx = DX[i % 3], dy = DY[(i * 7) % 4];
      s += `<circle cx="${cx}" cy="${cy}" r="${dim ? 3 : 4.5}" fill="${f.col}"
            opacity="${dim ? 0.1 : focus ? 1 : 0.88}" data-id="${c.id}"><title>${c.zh}</title></circle>`;
      if (!dim) {
        s += `<text x="${cx + dx}" y="${cy + dy}" text-anchor="middle" font-size="${focus ? 12.5 : 10.5}"
              fill="${focus ? f.col : '#454B5C'}" pointer-events="none"
              font-family="'Songti SC','SimSun',serif">${c.zh}</text>`;
      }
    });
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = s;
  }
  svg.addEventListener('click', e => {
    const c = e.target.closest('circle'); if (!c) return;
    const cat = cats.find(k => k.id === c.dataset.id); if (!cat) return;
    const f = FAM[cat.family];
    detail.innerHTML = `<b>${cat.zh}</b><span>${cat.en}</span><span style="color:${f.col}">${f.zh}</span>
      <span>舒服/难受 <span class="num">${cat.v > 0 ? '+' : ''}${cat.v}</span></span>
      <span>激动程度 <span class="num">${cat.a}</span></span>
      <span>行动倾向：${cat.tendency || '—'}</span>
      <span>半衰期 <span class="num">${cat.half_life ?? '—'}</span> 分钟</span>`;
  });
  const bar = document.getElementById('fambar');
  bar.innerHTML = Object.entries(FAM).map(([k, f]) => `
    <button class="fam on" data-fam="${k}" aria-pressed="true">
      <i style="background:${f.col}"></i>${f.zh}<span class="n">${DATA.families[k] || 0}</span></button>`).join('')
    + `<span class="axes"><button class="on" data-ax="v">横轴：舒服/难受</button>
       <button data-ax="d">横轴：支配感</button></span>`;
  bar.addEventListener('click', e => {
    const fb = e.target.closest('.fam'), ab = e.target.closest('.axes button');
    if (fb) {
      const k = fb.dataset.fam;
      if (on.size === Object.keys(FAM).length) { on.clear(); on.add(k); }
      else if (on.has(k) && on.size === 1) { Object.keys(FAM).forEach(f => on.add(f)); }
      else { on.clear(); on.add(k); }
      bar.querySelectorAll('.fam').forEach(b => b.classList.toggle('on', on.has(b.dataset.fam)));
      draw();
    } else if (ab) {
      axis = ab.dataset.ax;
      bar.querySelectorAll('.axes button').forEach(b => b.classList.toggle('on', b.dataset.ax === axis));
      draw();
    }
  });
  draw();
}

      (!q || c.zh.includes(q) || c.en.toLowerCase().includes(q)));
    if (sortK) {
      list = [...list].sort((x, y) => ((x[sortK] ?? -1) - (y[sortK] ?? -1)) * sortD);
    }
    document.querySelectorAll('#emcov .fam').forEach(b => b.classList.toggle('on', b.dataset.c === cov));
    document.getElementById('emrows').innerHTML = list.map(c => `
      <tr data-id="${c.id}" style="cursor:pointer">
        <td><b>${c.zh}</b> <span style="color:var(--grey);font-size:11px;font-family:var(--mono)">${c.id}</span></td>
        <td><span style="color:${FAM[c.family].col}">●</span> ${FAM[c.family].zh}</td>
        <td class="v num">${c.v > 0 ? '+' : ''}${c.v}</td>
        <td class="v num">${c.a}</td>
        <td>${c.tendency || '—'}</td>
        <td class="v num">${c.half_life ?? '—'}</td></tr>`).join('')
      || `<tr><td colspan="6" style="color:var(--grey)">无匹配</td></tr>`;
  }
  function showDetail(c) {
    const ladders = (c.ladder || []).map(([th, w]) =>
      `强度≥${th}：「${w}」`).join('　');
    const regs = Object.entries(c.reg_ladders || {}).map(([r, ld]) =>
      `${r === 'formal' ? '正式' : '口语'}：${ld.map(x => x[1]).join('/')}`).join('　');
    document.getElementById('emdetail').innerHTML =
      `<b>${c.zh}</b><span>${c.en}</span><span style="color:${FAM[c.family].col}">${FAM[c.family].zh}</span>
       <span>4D：V ${c.v} / A ${c.a} / D ${c.d} / U ${c.u}</span>
       <span>${ladders || '通用分档'}</span><span>${regs || '语域回退通用'}</span>`;
  }
  bar.addEventListener('click', e => {
    const b = e.target.closest('.fam'); if (!b) return;
    const k = b.dataset.fam;
    sel.has(k) ? sel.delete(k) : sel.add(k);
    if (!sel.size) sel.add(k);
    b.classList.toggle('on', sel.has(k));
    rows();
  });
  document.getElementById('emcov').addEventListener('click', e => {
    const b = e.target.closest('.fam'); if (!b) return;
    cov = cov === b.dataset.c ? 'all' : b.dataset.c;
    rows();
  });
  document.querySelector('#emrows').closest('table').querySelector('thead').addEventListener('click', e => {
    const th = e.target.closest('th.sortable'); if (!th) return;
    const k = th.dataset.k;
    if (sortK === k) sortD = -sortD; else { sortK = k; sortD = 1; }
    document.querySelectorAll('th.sortable').forEach(x =>
      x.textContent = x.textContent.replace(/ [↑↓↕]$/, '') + (x === th ? (sortD > 0 ? ' ↑' : ' ↓') : ' ↕'));
    rows();
  });
  document.getElementById('emq').addEventListener('input', rows);
  document.getElementById('emrows').addEventListener('click', e => {
    const tr = e.target.closest('tr[data-id]'); if (!tr) return;
    const c = DATA.categories.find(k => k.id === tr.dataset.id);
    if (c) showDetail(c);
  });
  rows();
  if (arg) {
    const c = DATA.categories.find(k => k.id === arg || k.zh === arg);
    if (c) showDetail(c);
  }
}

function dossierHTML(t) {

    <div class="dimbar ${neg && v < 0 ? 'neg' : ''}"><span>${label}</span>
      <div class="track"><div class="fill" style="width:${Math.min(100, Math.abs(v) * 100).toFixed(0)}%"></div></div>
      <span class="num">${v > 0 ? '+' : ''}${v}</span></div>`;
  const famCol = c => FAM[c]?.col || '#878C99';
  return `
  <div class="def">${t.def}。</div>
  ${t.eg ? `<div class="eg">例 ${t.eg}</div>` : ''}
  <div class="dossier">
    <h4>代表事件真算「${rep.title}」<span>单事件孤立运行 · 数值为引擎真实输出</span></h4>
    <div class="dstages">
      <div class="dstage"><b>① 事件字段</b>
        <pre>category  ${rep.ev.category}
goal_impacts  ${gi}
归因  ${rep.ev.agent || '—'} · ${rep.ev.intent} · 对象 ${rep.ev.affects}
${rep.ev.extras}
${rep.ev.dims}</pre></div>
      <div class="dstage"><b>② 评价剖面（SEC）</b>
        ${dim('目标相关', ap.rel)}${dim('促进/阻碍', ap.cond, true)}${dim('紧迫', ap.urg)}
        ${dim('新异', ap.nov)}${dim('控制感', ap.ctl)}${dim('自我标准', ap.int_std, true)}${dim('外部规范', ap.ext_std, true)}
        <div class="apnote">归因：${ap.agent || '无'}（${ap.intent}）→ ${ap.branches.map(b => BRANCH_ZH[b] || b).join(' / ')}</div></div>
      <div class="dstage"><b>③ 点燃</b>
        <div class="bars">${rep.fired.map(f => `
          <div class="bar-row"><span title="${f.zh}">${f.word && f.word !== f.zh ? f.word + '（' + f.zh + '）' : f.zh}</span>
            <div class="track"><div class="fill" style="width:${(f.intensity * 100).toFixed(0)}%;background:${famCol(f.family)}"></div></div>
            <span class="num">${f.intensity.toFixed(2)}</span></div>`).join('')
          || '<span style="color:var(--grey);font-size:12.5px">（无显著情绪）</span>'}</div>
        <div class="apnote">点燃类别按强度降序；词为该强度下的词表分档词。</div></div>
      <div class="dstage"><b>④ 动力学余波</b>
        <pre>心情(慢速层)  ${rep.after.mood > 0 ? '+' : ''}${rep.after.mood}
唤醒残余  ${rep.after.residue}
反刍压力  ${rep.after.rumination}
对象记账  ${Object.entries(rep.after.charges).map(([k, v]) => `${k} +${v}`).join('  ') || '—'}</pre></div>
      <div class="dstage"><b>⑤ 表达</b>
        <div class="say">「${rep.say || '（平静）'}」</div>
        <div class="apnote">${rep.fired.map(f => f.word && f.word !== f.zh ? `${f.word}（${f.zh}）` : f.zh).slice(0, 3).join(' · ')}</div></div>
    </div>
    <h4>变体点燃范围<span>同一事件类型，换关键评价量后引擎点燃什么</span></h4>
    <table class="vartab">${t.variants.map(v => `
      <tr><td style="width:220px">${v.label}</td><td>${
        v.fired.map(f => `<span class="vchip">${f.word || f.zh}<i> ${f.intensity.toFixed(2)}</i></span>`).join('')

      : '<span style="color:var(--grey)">demo 八幕中未出现</span>'}</div>
    <div class="relrow"><span class="k">模拟器</span><a class="vchip" href="#sim@${t.id}">「${t.label}」参数扫描（${t.knob}）</a></div>

function pageEvents() {
  const ts = DATA.event_types;
  const cnt = { neg: 0, pos: 0, dual: 0 };
  ts.forEach(t => cnt[t.valence]++);
  $(head('事件列表', '输入事件分 11 类——任何一件事至少归入一类，归入哪类决定它走哪条评价路径。每行可展开完整档案：代表事件五阶段引擎真算、变体点燃范围、回放/模拟器/词表跳转与规则出处。')
    + `<input class="search" id="evq" type="search" placeholder="搜索：冒犯 / 比较 / 憋屈 / 虚构…" aria-label="搜索事件类型">
       <div class="fambar" id="evfilter">
         <button class="fam on" data-v="all">全部 ${ts.length}</button>
         <button class="fam" data-v="neg">受损 ${cnt.neg}</button>
         <button class="fam" data-v="pos">利好 ${cnt.pos}</button>
         <button class="fam" data-v="dual">双向 ${cnt.dual}</button>
         <button class="fam" data-v="story">回放中出现 ${ts.filter(t => t.acts.length).length}</button>
       </div>
       <div id="evlist"></div>
       <div class="src">徽标（受损/利好/双向）与归因标注为展示层归纳；点燃/余波/表达全部为引擎真实输出（reader 画像，单事件孤立运行，与叙事回放页的累积状态不同）。</div>`);
  let vf = 'all', open = null;
  function rows() {
    const q = document.getElementById('evq').value.trim();
    const list = ts.filter(t => {
      if (vf === 'story' && !t.acts.length) return false;
      if (vf !== 'all' && vf !== 'story' && t.valence !== vf) return false;
      if (!q) return true;
      const hay = t.zh + t.def + t.eg + t.attr + t.knob + t.rep.title +
        t.rep.fired.map(f => f.zh + (f.word || '')).join('') +
        t.variants.map(v => v.label + v.fired.map(f => f.zh).join('')).join('');
      return hay.includes(q);
    });
    document.getElementById('evlist').innerHTML = list.map(t => `
      <div class="evtrow" data-id="${t.id}">
        <div class="er-head" role="button" tabindex="0" aria-expanded="false">
          <span class="code">${t.id}</span><b>${t.zh}</b>
          <span class="badge ${t.valence}">${VALZH[t.valence]}</span>
          <span class="badge ghost">${t.attr}</span>
          <span class="er-fire">常点燃：${t.rep.fired.slice(0, 3).map(f => f.word || f.zh).join(' · ') || '—'}</span>
          <span class="er-acts">${t.acts.length ? '回放 第' + t.acts.join(',') + '幕' : ''}</span>
          <span class="er-arrow">▾</span>
        </div>
        <div class="er-body" hidden></div>
      </div>`).join('') || '<div style="color:var(--grey);padding:20px 4px">无匹配</div>';
    open = null;
  }
  function toggle(row) {
    const id = row.dataset.id;
    const body = row.querySelector('.er-body');
    const willOpen = row !== open;
    document.querySelectorAll('.evtrow.open').forEach(r => {
      r.classList.remove('open');
      r.querySelector('.er-body').hidden = true;
      r.querySelector('.er-head').setAttribute('aria-expanded', 'false');
    });
    if (willOpen) {
      const t = ts.find(x => x.id === id);
      body.innerHTML = dossierHTML(t);
      row.classList.add('open');
      body.hidden = false;
      row.querySelector('.er-head').setAttribute('aria-expanded', 'true');
      open = row;
    } else open = null;
  }
  document.getElementById('evfilter').addEventListener('click', e => {
    const b = e.target.closest('.fam'); if (!b) return;
    vf = b.dataset.v;
    document.querySelectorAll('#evfilter .fam').forEach(x => x.classList.toggle('on', x === b));
    rows();
  });
  document.getElementById('evq').addEventListener('input', rows);
  document.getElementById('evlist').addEventListener('click', e => {
    const h = e.target.closest('.er-head');
    if (h) { toggle(h.closest('.evtrow')); return; }
    const a = e.target.closest('a.vchip');
    if (a) e.stopPropagation();   // 让 hash 链接正常跳转
  });
  document.getElementById('evlist').addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const h = e.target.closest('.er-head');
    if (h) { e.preventDefault(); toggle(h.closest('.evtrow')); }
  });
  rows();
}

function pageLexicon(arg) {
  $(head('词表浏览器', '88 个情绪的完整词条：每个情绪在不同强度下用什么词、正式/私下场合怎么换词。可按家族与语域覆盖筛选。')

       <div class="fambar" id="lxfam"></div>

         <button class="fam on" data-c="all">语域覆盖：全部</button>
         <button class="fam" data-c="formal">有正式梯</button>
         <button class="fam" data-c="coll">有口语梯</button>
         <button class="fam" data-c="plain">仅通用（回退）</button>
       </div>
       <div class="tablewrap"><table>
       <thead><tr><th>情绪</th><th>家族</th><th>通用词（按强度升档）</th><th>正式说法</th><th>口语说法</th></tr></thead>
       <tbody id="lxrows"></tbody></table></div>
       <div class="src">词表为引擎实际使用值（emotion_os/expression/lexicon.py）；语域梯只覆盖语域差异显著的类别，其余回退通用词。</div>`);
  const sel = new Set(Object.keys(FAM));
  let cov = 'all';
  document.getElementById('lxfam').innerHTML = Object.entries(FAM).map(([k, f]) =>
    `<button class="fam on" data-fam="${k}"><i style="background:${f.col}"></i>${f.zh}</button>`).join('');
  const covOf = c => (c.reg_ladders || {}).formal ? 'formal'
    : (c.reg_ladders || {}).colloquial ? 'coll' : 'plain';
  function rows() {
    const q = document.getElementById('lxq').value.trim();
    const list = DATA.categories.filter(c => {
      if (!sel.has(c.family)) return false;
      if (cov !== 'all' && covOf(c) !== cov) return false;
      if (!q) return true;
      const words = (c.ladder || []).map(x => x[1]).join('') +
        Object.values(c.reg_ladders || {}).flat().map(x => x[1]).join('');
      return c.zh.includes(q) || words.includes(q);
    });
    document.querySelectorAll('#lxcov .fam').forEach(b => b.classList.toggle('on', b.dataset.c === cov));
    document.getElementById('lxrows').innerHTML = list.map(c => {
      const ladder = (c.ladder || []).map(([th, w]) =>
        `<span style="display:inline-block;margin:1px 6px 1px 0;border:1px solid var(--hairline);border-radius:6px;padding:0 8px;background:var(--paper)">${w}<span style="color:var(--grey);font-size:10px;font-family:var(--mono)"> ≥${th}</span></span>`).join('');
      const f = (c.reg_ladders || {}).formal?.map(x => x[1]).join(' / ') || '—';
      const k = (c.reg_ladders || {}).colloquial?.map(x => x[1]).join(' / ') || '—';
      return `<tr><td><b>${c.zh}</b></td><td><span style="color:${FAM[c.family].col}">●</span></td><td>${ladder}</td><td>${f}</td><td>${k}</td></tr>`;
    }).join('') || `<tr><td colspan="5" style="color:var(--grey)">无匹配</td></tr>`;
  }
  document.getElementById('lxfam').addEventListener('click', e => {
    const b = e.target.closest('.fam'); if (!b) return;
    const k = b.dataset.fam;
    sel.has(k) ? sel.delete(k) : sel.add(k);
    if (!sel.size) sel.add(k);
    b.classList.toggle('on', sel.has(k));
    rows();
  });
  document.getElementById('lxcov').addEventListener('click', e => {
    const b = e.target.closest('.fam'); if (!b) return;
    cov = cov === b.dataset.c ? 'all' : b.dataset.c;
    rows();
  });
  document.getElementById('lxq').addEventListener('input', rows);
  rows();
  if (arg) {
    document.getElementById('lxq').value = arg;
    rows();
  }
}

        <input type="range" id="s-imp" min="0" max="6" step="1" value="1"
               aria-label="对目标的冲击"><output id="o-imp"></output></div>
      <div class="slider-row"><span>对方是故意的吗</span>
        <input type="range" id="s-int" min="0" max="2" step="1" value="0"
               aria-label="故意性"><output id="o-int"></output></div>
      <div class="slider-row"><span>我能改变它吗</span>
        <input type="range" id="s-ctl" min="0" max="2" step="1" value="1"
               aria-label="控制感"><output id="o-ctl"></output></div>
    </div>
    <div class="simout" id="simout"></div>`);
  const IMPS = [-1.0, -0.6, -0.2, 0.2, 0.6, 1.0, 0.0];
  const INTS = ['deliberate', 'accidental', 'unknown'];
  const INTZH = { deliberate: '故意', accidental: '无意', unknown: '不明' };
  const CTLS = [0.2, 0.5, 0.8];
  function setKnob() {
    document.getElementById('impname').textContent = DATA.sim_matrix[st.tid].knob || '对目标的冲击';
  }
  function fmt() {
    st.imp = IMPS[+document.getElementById('s-imp').value];
    st.intent = INTS[+document.getElementById('s-int').value];
    st.ctl = CTLS[+document.getElementById('s-ctl').value];
    document.getElementById('o-imp').textContent = (st.imp > 0 ? '+' : '') + st.imp;
    document.getElementById('o-int').textContent = INTZH[st.intent];
    document.getElementById('o-ctl').textContent = st.ctl;
    const m = DATA.sim_matrix[st.tid];
    const row = m.rows.find(r => r.imp === st.imp && r.intent === st.intent && r.ctl === st.ctl);
    const out = document.getElementById('simout');
    if (!row || !row.top.length) {
      out.innerHTML = `<div class="say" style="color:var(--grey)">（无显著情绪——该配置下引擎未点燃任何类别，边界同样真实）</div>`;
      return;
    }
    out.innerHTML = `<div style="font-size:12px;color:var(--grey);font-family:var(--mono)">引擎输出（效价 ${row.v > 0 ? '+' : ''}${row.v} / 唤醒 ${row.a}）</div>
      <div class="say">${row.say || '（平静）'}</div>
      <div class="bars">${row.top.map(t => `
        <div class="bar-row"><span>${t.zh}</span>
          <div class="track"><div class="fill" style="width:${(t.intensity * 100).toFixed(0)}%;background:${FAM[DATA.categories.find(c => c.id === t.cat)?.family]?.col || '#878C99'}"></div></div>
          <span class="num">${t.intensity.toFixed(2)}</span></div>`).join('')}</div>`;
  }
  document.getElementById('simtype').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    st.tid = b.dataset.t;
    document.querySelectorAll('#simtype button').forEach(x => x.classList.toggle('on', x === b));
    setKnob();
    fmt();
  });
  ['s-imp', 's-int', 's-ctl'].forEach(id =>
    document.getElementById(id).addEventListener('input', fmt));
  setKnob();
  fmt();
}

/* ============ 倒U实验室 ============ */
function pageUU() {
  $(head('倒 U 实验室', '安全框架内（如看恐怖片），享受随恐惧先升后降。拖动滑杆看不同恐惧强度下的享受值——曲线为引擎真实函数。')
    + `<div class="panel">
      <div class="slider-row"><span>恐惧强度</span>
        <input type="range" id="u-fear" min="0" max="100" step="1" value="30" aria-label="恐惧强度">
        <output id="u-out"></output></div>
      <svg id="uu" role="img" aria-label="倒U曲线"></svg>
      <div class="src">顶点 0.84 由 Andersen et al. 2020 鬼屋研究 OSF 开放数据拟合（CI 0.59–1.09）；
        v0.2 自设值 0.30 曾意味着「几乎不怕才最爽」——与数据相反。圆环标记旧自设值。</div>
    </div>`);
  const pts = DATA.fear_enjoyment;
  const svg = document.getElementById('uu');
  const W = 640, H = 300, mL = 48, mR = 16, mT = 18, mB = 36;
  const x = f => mL + (W - mL - mR) * f;
  const y = v => mT + (H - mT - mB) * (1 - v / 0.9);
  const peak = DATA.meta.peak;
  function draw(fear) {
    const val = pts[Math.round(fear * 100)];
    let s = '';
    s += `<line x1="${mL}" y1="${y(0)}" x2="${W - mR}" y2="${y(0)}" stroke="#D9DDE6"/>`;
    s += `<line x1="${mL}" y1="${mT}" x2="${mL}" y2="${y(0)}" stroke="#D9DDE6"/>`;
    s += `<path d="M${pts.map(p => `${x(p.fear).toFixed(1)},${y(p.enjoyment).toFixed(1)}`).join('L')}L${x(1)},${y(0)}L${x(0)},${y(0)}Z" fill="#D8552B" opacity="0.06"/>`;
    s += `<path d="M${pts.map(p => `${x(p.fear).toFixed(1)},${y(p.enjoyment).toFixed(1)}`).join('L')}" fill="none" stroke="#D8552B" stroke-width="2.5"/>`;
    s += `<line x1="${x(peak)}" y1="${mT}" x2="${x(peak)}" y2="${y(0)}" stroke="#878C99" stroke-dasharray="3 4"/>`;
    s += `<text x="${x(peak) + 6}" y="${mT + 12}" font-size="11.5" fill="#878C99" font-family="Consolas,monospace">peak 0.84</text>`;
    s += `<circle cx="${x(0.30)}" cy="${y(pts[30].enjoyment)}" r="3.5" fill="none" stroke="#878C99" stroke-width="1.5"/>`;
    s += `<circle cx="${x(fear)}" cy="${y(val.enjoyment)}" r="6.5" fill="#1B2030"/>`;
    s += `<line x1="${x(fear)}" y1="${y(val.enjoyment)}" x2="${x(fear)}" y2="${y(0)}" stroke="#1B2030" stroke-dasharray="2 3"/>`;
    s += `<text x="${(W + mL) / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#878C99">恐惧强度（引擎尺度）</text>`;
    s += `<text x="${mL - 6}" y="${mT + 10}" text-anchor="end" font-size="10" fill="#878C99" font-family="Consolas,monospace">享受</text>`;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = s;
    document.getElementById('u-out').textContent =
      `${fear.toFixed(2)} → 享受 ${val.enjoyment.toFixed(2)}`;
    if (fear > peak) {
      document.getElementById('u-out').textContent += '（已过峰，开始回落）';
    }
  }
  document.getElementById('u-fear').addEventListener('input', e => draw(e.target.value / 100));
  draw(0.30);
}

/* ============ 叙事回放 ============ */
function pageReplay(arg) {
  const ev = DATA.events;
  let cur = Math.min(ev.length - 1, Math.max(0, (parseInt(arg, 10) || 1) - 1));
  $(head('叙事回放', '一段八幕示例叙事（憋屈铺垫 → 反杀 → 和解）逐幕回放：每幕的表达词、情绪强度、心情与记忆。')
    + `<div class="steps-nav" id="rpnav">${ev.map((e, i) =>
      `<button data-i="${i}">第${i + 1}幕</button>`).join('')}</div>
      <div class="panel" id="rpdetail"></div>
      <div class="panel"><svg id="arc" role="img" aria-label="八幕弧线"></svg>
        <div class="legend">
          <span class="key"><span class="swatch" style="background:#1B2030"></span>记忆评分</span>
          <span class="key"><span class="swatch" style="background:#878C99"></span>心情（慢速层）</span>
          <span class="key"><span class="dot" style="background:#D8552B"></span>舒服的事件</span>
          <span class="key"><span class="dot" style="background:#3E5AA8"></span>难受的事件</span>
        </div></div>`);
  const W = 1000, H = 380, mL = 44, mR = 16, mT = 28, mB = 60;
  const x = i => mL + (W - mL - mR) * (i + 0.5) / ev.length;
  const y = v => mT + (H - mT - mB) * (1 - (v + 1) / 2);
  function drawArc() {
    let s = '';
    s += `<line x1="${mL}" y1="${y(0)}" x2="${W - mR}" y2="${y(0)}" stroke="#D9DDE6"/>`;
    s += `<polyline points="${ev.map((e, i) => `${x(i)},${y(e.mood)}`).join(' ')}"
          fill="none" stroke="#878C99" stroke-width="1.5" stroke-dasharray="4 4"/>`;
    for (let i = 0; i < ev.length - 1; i++) {
      const v = (ev[i].memory + ev[i + 1].memory) / 2;
      s += `<line x1="${x(i)}" y1="${y(ev[i].memory)}" x2="${x(i + 1)}" y2="${y(ev[i + 1].memory)}"
            stroke="${v >= 0 ? '#D8552B' : '#3E5AA8'}" stroke-width="3" stroke-linecap="round" opacity="0.85"/>`;
    }
    ev.forEach((e, i) => {
      const col = e.dims.valence >= 0 ? '#D8552B' : '#3E5AA8';
      const active = i <= cur;
      s += `<circle cx="${x(i)}" cy="${y(e.memory)}" r="${i === cur ? 7 : 5}" fill="${col}"
            opacity="${active ? 1 : 0.25}"/>`;
      if (active && e.words[0]) {
        const fs = 18 + 12 * Math.min(1, e.words[0].intensity);
        [...e.words[0].word].forEach((ch, k) => {
          s += `<text x="${x(i)}" y="${Math.max(mT + 8, y(e.memory) - 24 - ((e.words[0].word.length - k) * (fs + 3)))}"
                text-anchor="middle" font-family="'Songti SC','SimSun',serif" font-weight="700"
                font-size="${fs.toFixed(1)}" fill="${col}">${ch}</text>`;
        });
      }
      s += `<text x="${x(i)}" y="${H - mB + 24}" text-anchor="middle" font-size="12"
            fill="${i === cur ? '#1B2030' : '#878C99'}" ${i === cur ? 'font-weight="600"' : ''}>${e.title}</text>`;
    });
    document.getElementById('arc').setAttribute('viewBox', `0 0 ${W} ${H}`);
    document.getElementById('arc').innerHTML = s;
  }
  function show(i) {
    cur = i;
    document.querySelectorAll('#rpnav button').forEach((b, j) => b.classList.toggle('on', j === i));
    const e = ev[i];
    document.getElementById('rpdetail').innerHTML = `
      <div style="font-family:var(--mono);font-size:11px;color:var(--grey)">第 ${i + 1} 幕 · ${e.title} · 事隔 ${e.dt >= 1440 ? e.dt / 1440 + ' 天' : e.dt + ' 分钟'}</div>
      <div style="font-family:var(--serif);font-size:24px;font-weight:700;margin:4px 0 10px">${e.summary || '（平静）'}</div>
      <div class="bars">${e.words.map(w => `
        <div class="bar-row"><span>${w.zh}</span>
          <div class="track"><div class="fill" style="width:${(w.intensity * 100).toFixed(0)}%;background:${FAM[DATA.categories.find(c => c.id === w.category)?.family]?.col || '#878C99'}"></div></div>
          <span class="num">${w.intensity.toFixed(2)}</span></div>`).join('')}</div>
      <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:#454B5C">
        <span>4D：V <span class="num">${e.dims.valence}</span> / A <span class="num">${e.dims.arousal}</span> / D <span class="num">${e.dims.dominance}</span> / U <span class="num">${e.dims.unpredictability}</span></span>
        <span>心情 <span class="num">${e.mood > 0 ? '+' : ''}${e.mood}</span></span>
        <span>记忆评分 <span class="num">${e.memory > 0 ? '+' : ''}${e.memory}</span></span></div>`;
    drawArc();
  }
  document.getElementById('rpnav').addEventListener('click', e => {
    const b = e.target.closest('button'); if (b) show(+b.dataset.i);
  });
  show(cur);
}

/* ============ 情绪对比 ============ */
function pageCompare() {
  $(head('情绪对比', '选 2–4 个情绪类别，在 4D 坐标上并排对比（雷达图 + 数值表）。')
    + `<div class="panel radar-frame">
      <div style="min-width:0"><h3 style="margin-bottom:8px">已选（点下方词条增删）</h3>
        <input class="search" id="cmq" type="search" placeholder="在 88 个类别中搜索…" aria-label="搜索对比候选" style="margin-bottom:8px;max-width:300px">
        <div class="picklist" id="cmpick"></div></div>
      <svg id="radar" role="img" aria-label="4D雷达对比"></svg>
    </div>
    <div class="tablewrap" style="max-width:640px"><table>
      <thead><tr><th>情绪</th><th>效价 V</th><th>唤醒 A</th><th>支配 D</th><th>不可预测 U</th></tr></thead>
      <tbody id="cmrows"></tbody></table></div>`);
  const sel = new Set(['jie_qi', 'wei_yuan', 'fear']);
  const DIMS = [['v', '舒服/难受'], ['a', '激动'], ['d', '支配'], ['u', '不可预测']];
  function draw() {
    const cats = DATA.categories.filter(c => sel.has(c.id));
    const q = (document.getElementById('cmq').value || '').trim();
    document.getElementById('cmpick').innerHTML = DATA.categories
      .filter(c => !q || c.zh.includes(q) || c.en.toLowerCase().includes(q.toLowerCase()))
      .map(c =>
      `<button class="pick ${sel.has(c.id) ? 'on' : ''}" data-id="${c.id}">${c.zh}</button>`).join('');
    document.getElementById('cmrows').innerHTML = cats.map(c => `
      <tr><td><b style="color:${FAM[c.family].col}">${c.zh}</b></td>
        <td class="v num">${c.v}</td><td class="v num">${c.a}</td>
        <td class="v num">${c.d}</td><td class="v num">${c.u}</td></tr>`).join('');
    // 雷达
    const svg = document.getElementById('radar');
    const S = 300, cx = S / 2, cy = S / 2, R = 105;
    const pt = (di, val) => {
      const ang = -Math.PI / 2 + di * Math.PI / 2;
      const r = R * Math.abs(val) / (di === 1 ? 1 : 1);   // a/u: 0–1；v/d: −1–1 取绝对半径按符号分向
      const rr = (di === 0 || di === 2) ? R * Math.abs(val) : R * val;
      return [cx + rr * Math.cos(ang), cy + rr * Math.sin(ang)];
    };
    let s = '';
    for (const ring of [0.33, 0.66, 1]) {
      s += `<polygon points="${[0, 1, 2, 3].map(d => {
        const ang = -Math.PI / 2 + d * Math.PI / 2;
        return `${(cx + R * ring * Math.cos(ang)).toFixed(1)},${(cy + R * ring * Math.sin(ang)).toFixed(1)}`;
      }).join(' ')}" fill="none" stroke="#EDF0F5"/>`;
    }
    s += [0, 1, 2, 3].map(d => {
      const ang = -Math.PI / 2 + d * Math.PI / 2;
      return `<line x1="${cx}" y1="${cy}" x2="${cx + R * Math.cos(ang)}" y2="${cy + R * Math.sin(ang)}" stroke="#EDF0F5"/>
        <text x="${cx + (R + 16) * Math.cos(ang)}" y="${cy + (R + 16) * Math.sin(ang) + 4}"
              text-anchor="middle" font-size="11" fill="#878C99">${DIMS[d][1]}</text>`;
    }).join('');
    cats.forEach(c => {
      const pts = DIMS.map(([k], d) => {
        const val = c[k];
        const rr = (d === 0 || d === 2) ? R * Math.abs(val) : R * val;
        const ang = -Math.PI / 2 + d * Math.PI / 2;
        return `${(cx + rr * Math.cos(ang)).toFixed(1)},${(cy + rr * Math.sin(ang)).toFixed(1)}`;
      }).join(' ');
      s += `<polygon points="${pts}" fill="${FAM[c.family].col}" fill-opacity="0.12"
            stroke="${FAM[c.family].col}" stroke-width="2"/>`;
    });
    svg.setAttribute('viewBox', `0 0 ${S} ${S}`);
    svg.innerHTML = s;
  }
  document.getElementById('cmpick').addEventListener('click', e => {
    const b = e.target.closest('.pick'); if (!b) return;
    const id = b.dataset.id;
    if (sel.has(id)) { if (sel.size > 1) sel.delete(id); } else { if (sel.size < 4) sel.add(id); }
    draw();
  });
  document.getElementById('cmq').addEventListener('input', draw);
  draw();
}

/* ============ 路由 ============ */
const PAGES = { home: pageHome, emotions: pageEmotions, events: pageEvents,
  lexicon: pageLexicon, params: pageParams, sim: pageSim, uu: pageUU,
  peakend: pagePeakEnd, replay: pageReplay, compare: pageCompare,
  mechs: pageMechs, llm: pageLLM };
function route() {
  const h = (location.hash || '#home').slice(1);

  const p = at < 0 ? h : h.slice(0, at);
  const arg = at < 0 ? '' : decodeURIComponent(h.slice(at + 1));
  const fn = PAGES[p] || pageHome;
  document.querySelectorAll('#nav a').forEach(a =>
    a.classList.toggle('on', a.dataset.p === (PAGES[p] ? p : 'home')));

  window.scrollTo(0, 0);
}
